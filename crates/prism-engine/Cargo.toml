[package]
name = "prism-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Prism download engine: dynamic multi-segment HTTP(S)/FTP(S) downloads, HLS/DASH, resume, rate limiting."

[features]
default = []
## Experimental HTTP/3 (QUIC) support via reqwest. Requires `RUSTFLAGS="--cfg reqwest_unstable"`.
http3 = ["reqwest/http3"]

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
mime_guess = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
http-auth = "0.1.10"
ntlmclient = "0.2"
base64 = "0.22"
fastrand = "2.5"
fs4 = { version = "1.1", features = ["sync"] }
suppaftp = { version = "12.2", features = ["tokio", "tokio-rustls-aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false }
m3u8-rs = "6.0"
dash-mpd-core = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
prism-testserver = { path = "../prism-testserver" }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
